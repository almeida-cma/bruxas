<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halloween da Proz</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a0a;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(255, 100, 0, 0.15) 0%, transparent 30%),
                radial-gradient(circle at 80% 70%, rgba(138, 43, 226, 0.15) 0%, transparent 30%),
                radial-gradient(circle at 50% 50%, rgba(255, 165, 0, 0.08) 0%, transparent 60%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* Estrelas de fundo */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(2px 2px at 20px 30px, #fff, transparent),
                radial-gradient(2px 2px at 40px 70px, #fff, transparent),
                radial-gradient(1px 1px at 90px 40px, #fff, transparent),
                radial-gradient(2px 2px at 130px 80px, #fff, transparent),
                radial-gradient(1px 1px at 160px 120px, #fff, transparent),
                radial-gradient(2px 2px at 200px 50px, #fff, transparent),
                radial-gradient(1px 1px at 250px 150px, #fff, transparent),
                radial-gradient(2px 2px at 300px 90px, #fff, transparent);
            background-repeat: repeat;
            background-size: 350px 200px;
            opacity: 0.3;
            pointer-events: none;
            z-index: 0;
        }

        /* Morcegos decorativos */
        .bat {
            position: fixed;
            font-size: 40px;
            z-index: 1;
            animation: fly 12s linear infinite;
            opacity: 0.5;
        }

        .bat:nth-child(1) { top: 10%; animation-delay: 0s; }
        .bat:nth-child(2) { top: 30%; animation-delay: 3s; font-size: 30px; }
        .bat:nth-child(3) { top: 60%; animation-delay: 6s; font-size: 50px; }
        .bat:nth-child(4) { top: 80%; animation-delay: 9s; font-size: 25px; }

        @keyframes fly {
            0% { left: -100px; transform: scaleX(1) translateY(0); }
            25% { transform: scaleX(1) translateY(-30px); }
            50% { transform: scaleX(1) translateY(20px); }
            75% { transform: scaleX(1) translateY(-15px); }
            100% { left: 110%; transform: scaleX(1) translateY(0); }
        }

        header {
            text-align: center;
            margin-bottom: 50px;
            z-index: 10;
            position: relative;
        }

        .pumpkin {
            font-size: 80px;
            display: block;
            margin-bottom: 10px;
            animation: glow 2s ease-in-out infinite alternate;
            filter: drop-shadow(0 0 20px rgba(255, 100, 0, 0.8));
        }

        @keyframes glow {
            from { filter: drop-shadow(0 0 15px rgba(255, 100, 0, 0.6)); transform: scale(1); }
            to { filter: drop-shadow(0 0 35px rgba(255, 140, 0, 1)); transform: scale(1.05); }
        }

        h1 {
            font-size: clamp(2rem, 6vw, 3.5rem);
            color: #ff6b1a;
            text-shadow: 
                0 0 10px #ff6b1a,
                0 0 20px #ff6b1a,
                0 0 40px #ff4500,
                0 0 80px #ff4500;
            letter-spacing: 3px;
            font-weight: 800;
            animation: flicker 3s infinite alternate;
        }

        @keyframes flicker {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.85; }
            70% { opacity: 1; }
            75% { opacity: 0.7; }
            80% { opacity: 1; }
        }

        .subtitle {
            color: #b0b0b0;
            font-size: 1.1rem;
            margin-top: 10px;
            letter-spacing: 2px;
        }

        .links-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
            max-width: 1100px;
            width: 100%;
            z-index: 10;
            position: relative;
        }

        .link-card {
            background: linear-gradient(145deg, #1a1a2e, #16213e);
            border: 2px solid #ff6b1a;
            border-radius: 15px;
            padding: 25px 20px;
            text-decoration: none;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 18px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            position: relative;
            overflow: hidden;
        }

        .link-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 107, 26, 0.2), transparent);
            transition: left 0.5s ease;
        }

        .link-card:hover::before {
            left: 100%;
        }

        .link-card:hover {
            transform: translateY(-5px) scale(1.02);
            border-color: #ffaa00;
            box-shadow: 
                0 8px 25px rgba(255, 107, 26, 0.4),
                0 0 30px rgba(255, 107, 26, 0.3);
        }

        .link-icon {
            font-size: 2.2rem;
            flex-shrink: 0;
            filter: drop-shadow(0 0 8px rgba(255, 107, 26, 0.6));
        }

        .link-text {
            font-size: 1.05rem;
            font-weight: 600;
            line-height: 1.3;
        }

        .link-number {
            font-size: 0.85rem;
            color: #ffaa00;
            display: block;
            margin-bottom: 4px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        footer {
            margin-top: 60px;
            color: #666;
            font-size: 0.9rem;
            z-index: 10;
            position: relative;
            text-align: center;
        }

        /* Abóboras decorativas nos cantos */
        .corner-pumpkin {
            position: fixed;
            font-size: 60px;
            opacity: 0.25;
            z-index: 0;
        }

        .corner-pumpkin.tl { top: 20px; left: 20px; transform: rotate(-15deg); }
        .corner-pumpkin.tr { top: 20px; right: 20px; transform: rotate(15deg); }
        .corner-pumpkin.bl { bottom: 20px; left: 20px; transform: rotate(15deg); }
        .corner-pumpkin.br { bottom: 20px; right: 20px; transform: rotate(-15deg); }

        @media (max-width: 600px) {
            .corner-pumpkin { font-size: 35px; }
            .links-container { grid-template-columns: 1fr; }
            .link-card { padding: 20px 15px; }
        }
    </style>
</head>
<body>

    <!-- Morcegos voando -->
    <div class="bat">🦇</div>
    <div class="bat">🦇</div>
    <div class="bat">🦇</div>
    <div class="bat">🦇</div>

    <!-- Abóboras decorativas nos cantos -->
    <div class="corner-pumpkin tl">🎃</div>
    <div class="corner-pumpkin tr">🎃</div>
    <div class="corner-pumpkin bl">🎃</div>
    <div class="corner-pumpkin br">🎃</div>

    <header>
        <span class="pumpkin">🎃</span>
        <h1>Halloween da Proz</h1>
        <p class="subtitle">✦ Escolha uma atividade assustadoramente divertida ✦</p>
    </header>

    <main class="links-container">

        <a href="https://almeida-cma.github.io/filtros/" target="_blank" rel="noopener noreferrer" class="link-card">
            <span class="link-icon">🖼️</span>
            <span class="link-text">
                <span class="link-number">01</span>
                Filtros para fotografias
            </span>
        </a>

        <a href="https://almeida-cma.github.io/morcego/" target="_blank" rel="noopener noreferrer" class="link-card">
            <span class="link-icon">🦇</span>
            <span class="link-text">
                <span class="link-number">02</span>
                Jogo do Morcego Maluco
            </span>
        </a>

        <a href="https://almeida-cma.github.io/space/" target="_blank" rel="noopener noreferrer" class="link-card">
            <span class="link-icon">🚀</span>
            <span class="link-text">
                <span class="link-number">03</span>
                Jogo Space Churros
            </span>
        </a>

        <a href="https://almeida-cma.github.io/cds_desafio1/halloween-tech-lab.html" target="_blank" rel="noopener noreferrer" class="link-card">
            <span class="link-icon">🧪</span>
            <span class="link-text">
                <span class="link-number">04</span>
                Halloween Tech Lab
            </span>
        </a>

        <a href="https://kahoot.it/challenge/03901726?challenge-id=b4c24f45-a0df-4a6b-892a-ebc36c43780b_1793380464812" target="_blank" rel="noopener noreferrer" class="link-card">
            <span class="link-icon">🎯</span>
            <span class="link-text">
                <span class="link-number">05</span>
                Desafio Kahoot revisão até tema 6
            </span>
        </a>

    </main>

    <footer>
        <p>🎃 Boa sorte e bom Halloween! 🎃</p>
    </footer>

</body>
</html>
